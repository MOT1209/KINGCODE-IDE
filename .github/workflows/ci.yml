name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax gate (node --check)
        run: |
          set -e
          for f in js/*.js tools/*.js tools/unit/*.js tools/packaging/*.js tools/packaging/platforms/*.js; do
            node --check "$f"
            echo "OK  $f"
          done

      - name: Zero-dep smoke suite (audit regression guards)
        run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev tooling (ESLint; dev-only)
        run: npm install --no-audit --no-fund

      - name: ESLint
        run: npm run lint

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      KC_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev tooling (Playwright is a devDependency only)
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: "E2E (real browser - workflows, regression, security)"
        run: npm run test:e2e
