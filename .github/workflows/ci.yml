name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax gate (node --check)
        run: |
          set -e
          for f in js/*.js tools/*.js; do
            node --check "$f"
            echo "OK  $f"
          done

      - name: Zero-dep smoke suite (audit regression guards)
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev tooling (Playwright is a devDependency only)
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: E2E (real Chromium: workflows + regression + security)
        run: npm run test:e2e
